<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Купить билет — Зверополис</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header">
    <div class="header__inner container">
      <a class="header__logo" href="index.html">
        <img src="img/logo.png" alt="Зверополис" width="120" height="120">
      </a>

      <button class="header__burger" type="button" aria-label="Открыть меню" data-burger>
        <span></span><span></span><span></span>
      </button>

      <nav class="header__nav nav" data-nav>
        <ul class="nav__list">
          <li class="nav__item"><a class="nav__link" href="bilet.html">Купить билет</a></li>
          <li class="nav__item"><a class="nav__link" href="pets.html">Животные</a></li>
          <li class="nav__item"><a class="nav__link" href="pomoch.html">Оказать помощь</a></li>
          <li class="nav__item"><a class="nav__link" href="kontakt.html">Контакты</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="tickets">
      <div class="container container--narrow">
        <h1 class="section__title">Купить билет</h1>

        <form class="tickets__form form" id="ticketForm" novalidate>
          <fieldset class="form__fieldset">
            <legend class="form__legend">Контактные данные</legend>

            <div class="form__grid">
              <div class="form__field">
                <label class="form__label" for="firstName">Имя <span class="form__req" aria-hidden="true">*</span></label>
                <input class="form__input" type="text" id="firstName" name="firstName" autocomplete="given-name" aria-required="true" aria-describedby="firstName-error">
                <p class="form__error" id="firstName-error" role="alert"></p>
              </div>

              <div class="form__field">
                <label class="form__label" for="lastName">Фамилия <span class="form__req" aria-hidden="true">*</span></label>
                <input class="form__input" type="text" id="lastName" name="lastName" autocomplete="family-name" aria-required="true" aria-describedby="lastName-error">
                <p class="form__error" id="lastName-error" role="alert"></p>
              </div>

              <div class="form__field">
                <label class="form__label" for="email">Email <span class="form__req" aria-hidden="true">*</span></label>
                <input class="form__input" type="email" id="email" name="email" autocomplete="email" aria-required="true" aria-describedby="email-error">
                <p class="form__error" id="email-error" role="alert"></p>
              </div>

              <div class="form__field">
                <label class="form__label" for="phone">Номер телефона <span class="form__req" aria-hidden="true">*</span></label>
                <input class="form__input" type="tel" id="phone" name="phone" autocomplete="tel" placeholder="+7 (___) ___-__-__" aria-required="true" aria-describedby="phone-error">
                <p class="form__error" id="phone-error" role="alert"></p>
              </div>
            </div>
          </fieldset>

          <fieldset class="form__fieldset">
            <legend class="form__legend">Билеты</legend>

            <div class="form__grid">
              <div class="form__field">
                <label class="form__label" for="adultTickets">Взрослые билеты</label>
                <div class="form__counter" data-counter>
                  <button class="form__counter-btn" type="button" data-counter-minus aria-label="Уменьшить">−</button>
                  <input class="form__input form__input--counter" type="number" id="adultTickets" name="adultTickets" min="0" max="50" step="1" value="0" data-counter-input data-price="800" inputmode="numeric">
                  <button class="form__counter-btn" type="button" data-counter-plus aria-label="Увеличить">+</button>
                </div>
              </div>

              <div class="form__field">
                <label class="form__label" for="childTickets">Детские билеты</label>
                <div class="form__counter" data-counter>
                  <button class="form__counter-btn" type="button" data-counter-minus aria-label="Уменьшить">−</button>
                  <input class="form__input form__input--counter" type="number" id="childTickets" name="childTickets" min="0" max="50" step="1" value="0" data-counter-input data-price="400" inputmode="numeric">
                  <button class="form__counter-btn" type="button" data-counter-plus aria-label="Увеличить">+</button>
                </div>
              </div>
            </div>
          </fieldset>

          <fieldset class="form__fieldset">
            <legend class="form__legend">Дата и время посещения</legend>

            <div class="form__grid">
              <div class="form__field">
                <label class="form__label" for="visitDate">Дата посещения <span class="form__req" aria-hidden="true">*</span></label>
                <input class="form__input" type="date" id="visitDate" name="visitDate" aria-required="true" aria-describedby="visitDate-error">
                <p class="form__error" id="visitDate-error" role="alert"></p>
              </div>

              <div class="form__field">
                <label class="form__label" for="visitTime">Время посещения <span class="form__req" aria-hidden="true">*</span></label>
                <input class="form__input" type="time" id="visitTime" name="visitTime" min="09:00" max="20:00" step="1800" aria-required="true" aria-describedby="visitTime-error">
                <p class="form__error" id="visitTime-error" role="alert"></p>
              </div>
            </div>
          </fieldset>

          <fieldset class="form__fieldset">
            <legend class="form__legend">Дополнительные услуги</legend>

            <div class="form__field">
              <label class="form__label" for="service">Выбор услуги</label>
              <select class="form__input form__select" id="service" name="service" data-service>
                <option value="none" data-price="0">Без дополнительных услуг</option>
                <option value="excursion" data-price="500">Экскурсия — 500 ₽</option>
                <option value="handAnimals" data-price="700">Занятия с ручными животными — 700 ₽</option>
                <option value="contactZoo" data-price="400">Контактный зоопарк — 400 ₽</option>
                <option value="butterflyPark" data-price="600">Парк бабочек — 600 ₽</option>
                <option value="lectory" data-price="300">Лекторий — 300 ₽</option>
                <option value="kinolectory" data-price="350">Кинолекторий — 350 ₽</option>
                <option value="attractions" data-price="450">Аттракционы — 450 ₽</option>
              </select>
            </div>
          </fieldset>

          <div class="tickets__total">
            <span class="tickets__total-label">Итого:</span>
            <span class="tickets__total-value" data-total>0 ₽</span>
          </div>

          <button class="btn btn--primary tickets__submit" type="submit">Купить билет</button>

          <p class="tickets__message" data-form-message role="status" hidden></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <p class="footer__copy">© Зверополис, 2025</p>
      <p class="footer__note">Сделано с заботой о природе</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
